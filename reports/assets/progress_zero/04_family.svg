<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}.title{font-size:40px;font-weight:800}.sub{font-size:22px;fill:#66737f}.name{font-size:30px;font-weight:800}.body{font-size:20px;fill:#40576a}.metric{font-size:20px;font-weight:700}.win{font-size:18px;font-weight:800}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#f6f9fc"/>
  <text class="title" x="600" y="62" text-anchor="middle">Flow 和 Diffusion，谁赢了？</text>
  <text class="sub" x="600" y="98" text-anchor="middle">同一数据、同一预算、同一随机库：正式答案是“没有总冠军”</text>
  <rect x="45" y="138" width="350" height="386" rx="28" fill="#edf6fc" stroke="#81b2d3" stroke-width="3"/>
  <circle cx="220" cy="215" r="62" fill="#2e74b5"/>
  <path d="M166 215 C184 175 213 255 235 205 S278 171 279 228" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <text class="name" x="220" y="315" text-anchor="middle">FLOW</text>
  <text class="body" x="220" y="355" text-anchor="middle">像一条连续运输带</text>
  <text class="body" x="220" y="389" text-anchor="middle">把随机噪声送到未来轨迹</text>
  <rect x="85" y="430" width="270" height="55" rx="16" fill="#dceef9"/>
  <text class="win" x="220" y="464" text-anchor="middle" fill="#21628e">平均 / 联合质量、覆盖更好</text>

  <rect x="805" y="138" width="350" height="386" rx="28" fill="#f4effa" stroke="#b9a3d0" stroke-width="3"/>
  <circle cx="980" cy="215" r="62" fill="#7d68a7"/>
  <circle cx="956" cy="194" r="12" fill="#fff" opacity=".35"/><circle cx="987" cy="218" r="16" fill="#fff" opacity=".6"/><circle cx="1013" cy="188" r="8" fill="#fff" opacity=".8"/>
  <path d="M945 245 Q980 224 1018 246" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text class="name" x="980" y="315" text-anchor="middle">DIFFUSION</text>
  <text class="body" x="980" y="355" text-anchor="middle">像把一张模糊照片</text>
  <text class="body" x="980" y="389" text-anchor="middle">一步步擦清楚</text>
  <rect x="845" y="430" width="270" height="55" rx="16" fill="#e9e0f2"/>
  <text class="win" x="980" y="464" text-anchor="middle" fill="#654b8c">前后时间关系更好</text>

  <rect x="435" y="145" width="330" height="345" rx="24" fill="#fff" stroke="#cad5de" stroke-width="3"/>
  <text x="600" y="188" text-anchor="middle" font-size="22" font-weight="800" fill="#66737f">六项正式成绩</text>
  <g transform="translate(470 215)">
    <text class="metric" x="0" y="0">平均准不准</text><rect x="174" y="-20" width="105" height="30" rx="12" fill="#dceef9"/><text class="win" x="226" y="2" text-anchor="middle" fill="#21628e">Flow</text>
    <text class="metric" x="0" y="48">上下跳动</text><rect x="174" y="28" width="105" height="30" rx="12" fill="#edf0f2"/><text class="win" x="226" y="50" text-anchor="middle" fill="#5f6c75">几乎一样</text>
    <text class="metric" x="0" y="96">整体联合</text><rect x="174" y="76" width="105" height="30" rx="12" fill="#dceef9"/><text class="win" x="226" y="98" text-anchor="middle" fill="#21628e">Flow</text>
    <text class="metric" x="0" y="144">前后关系</text><rect x="174" y="124" width="105" height="30" rx="12" fill="#e9e0f2"/><text class="win" x="226" y="146" text-anchor="middle" fill="#654b8c">Diffusion</text>
    <text class="metric" x="0" y="192">范围覆盖</text><rect x="174" y="172" width="105" height="30" rx="12" fill="#dceef9"/><text class="win" x="226" y="194" text-anchor="middle" fill="#21628e">Flow</text>
    <text class="metric" x="0" y="240">区间宽窄</text><rect x="174" y="220" width="105" height="30" rx="12" fill="#e9e0f2"/><text class="win" x="226" y="242" text-anchor="middle" fill="#654b8c">DDPM*</text>
  </g>
  <text x="600" y="514" text-anchor="middle" font-size="16" fill="#798895">* DDPM 更窄，但也漏掉更多真实结果，因此不能单独算胜利</text>
  <rect x="95" y="557" width="1010" height="82" rx="22" fill="#fff4dc" stroke="#d6a54a" stroke-width="2"/>
  <text x="600" y="590" text-anchor="middle" font-size="24" font-weight="800" fill="#9a5d00">后续使用 Diffusion ≠ Diffusion 已经赢了</text>
  <text x="600" y="621" text-anchor="middle" font-size="20" fill="#744d17">只是因为它有清楚的“从模糊到清晰”阶段，正好能研究时间信息何时介入</text>
</svg>
