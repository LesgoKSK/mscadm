<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#2e74b5"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}.title{font-size:40px;font-weight:800}.sub{font-size:22px;fill:#66737f}.head{font-size:25px;font-weight:800}.body{font-size:19px;fill:#435b6d}.yes{font-size:19px;font-weight:800;fill:#237447}.no{font-size:18px;font-weight:800;fill:#a13c43}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#f5f9fc"/>
  <text class="title" x="600" y="60" text-anchor="middle">现在的创新想法：给模型装“聪明的时间辅助”</text>
  <text class="sub" x="600" y="96" text-anchor="middle">不是一直开着；只有真正需要、真正合适时才轻轻介入</text>

  <rect x="48" y="158" width="245" height="245" rx="25" fill="#17365d"/>
  <text class="head" x="170" y="205" text-anchor="middle" style="fill:#fff">稳定基础模型</text>
  <circle cx="170" cy="278" r="48" fill="#2e74b5"/><path d="M132 282 Q170 227 208 282 T246 282" fill="none" stroke="#fff" stroke-width="8" transform="translate(-38 0)"/>
  <text class="body" x="170" y="356" text-anchor="middle" style="fill:#d9e8f2">先保证“车能稳稳地开”</text>

  <path d="M308 280 H362" stroke="#2e74b5" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="378" y="137" width="265" height="286" rx="25" fill="#fff" stroke="#9ec4dc" stroke-width="3"/>
  <text class="head" x="510" y="180" text-anchor="middle">开关 1：天气需要吗？</text>
  <circle cx="510" cy="254" r="44" fill="#edf5fb" stroke="#2e74b5" stroke-width="5"/>
  <path d="M478 260 C493 232 514 276 544 240" fill="none" stroke="#2e74b5" stroke-width="7" stroke-linecap="round"/>
  <text class="body" x="510" y="328" text-anchor="middle">风在变速、转向，</text><text class="body" x="510" y="355" text-anchor="middle">或各区域差异变大？</text>
  <rect x="414" y="375" width="87" height="31" rx="12" fill="#e8f5ee"/><text class="yes" x="458" y="397" text-anchor="middle">是：继续</text>
  <rect x="518" y="375" width="87" height="31" rx="12" fill="#fdecef"/><text class="no" x="562" y="397" text-anchor="middle">否：不开</text>

  <path d="M659 280 H713" stroke="#2e74b5" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="729" y="137" width="265" height="286" rx="25" fill="#fff" stroke="#b9a3d0" stroke-width="3"/>
  <text class="head" x="862" y="180" text-anchor="middle">开关 2：阶段合适吗？</text>
  <rect x="778" y="220" width="168" height="68" rx="18" fill="#ebe4f3"/>
  <circle cx="815" cy="254" r="20" fill="#7d68a7" opacity=".25"/><circle cx="862" cy="254" r="20" fill="#7d68a7" opacity=".55"/><circle cx="909" cy="254" r="20" fill="#7d68a7"/>
  <text class="body" x="862" y="328" text-anchor="middle">当前画面能看出</text><text class="body" x="862" y="355" text-anchor="middle">值得修的时间结构吗？</text>
  <rect x="765" y="375" width="87" height="31" rx="12" fill="#e8f5ee"/><text class="yes" x="809" y="397" text-anchor="middle">是：继续</text>
  <rect x="869" y="375" width="87" height="31" rx="12" fill="#fdecef"/><text class="no" x="913" y="397" text-anchor="middle">否：不开</text>

  <path d="M1010 280 H1050" stroke="#2e74b5" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1060" y="187" width="100" height="184" rx="24" fill="#e8f5ee" stroke="#5b9e74" stroke-width="3"/>
  <text x="1110" y="228" text-anchor="middle" font-size="22" font-weight="800" fill="#237447">轻轻修正</text>
  <path d="M1083 296 L1101 313 L1138 266" fill="none" stroke="#237447" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1110" y="345" text-anchor="middle" font-size="16" fill="#3f7353">幅度有上限</text>

  <rect x="90" y="474" width="1020" height="137" rx="24" fill="#fff" stroke="#cad8e2" stroke-width="2"/>
  <text class="head" x="150" y="517">去噪像把照片从模糊擦清楚：</text>
  <g transform="translate(445 500)">
    <rect width="170" height="73" rx="16" fill="#e4e7ea"/><circle cx="85" cy="36" r="24" fill="#7d68a7" opacity=".17"/><text x="85" y="102" text-anchor="middle" font-size="18" fill="#657480">太模糊：看不清，先别修</text>
  </g>
  <g transform="translate(660 500)">
    <rect width="170" height="73" rx="16" fill="#e9e0f2"/><path d="M30 52 C63 23 91 65 139 21" fill="none" stroke="#7d68a7" stroke-width="7" opacity=".8"/><text x="85" y="102" text-anchor="middle" font-size="18" font-weight="800" fill="#654b8c">中间阶段：可能最值得修</text>
  </g>
  <g transform="translate(875 500)">
    <rect width="170" height="73" rx="16" fill="#edf5fb"/><path d="M30 52 C63 23 91 65 139 21" fill="none" stroke="#2e74b5" stroke-width="7"/><text x="85" y="102" text-anchor="middle" font-size="18" fill="#657480">快完成：别把结果改坏</text>
  </g>
  <text x="600" y="650" text-anchor="middle" font-size="20" font-weight="800" fill="#237447">核心不是“加更大的模块”，而是“只在值得的时候做小修正”</text>
</svg>
