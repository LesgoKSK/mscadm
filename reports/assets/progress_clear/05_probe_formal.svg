<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#718da3"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}.title{font-size:38px;font-weight:800}.sub{font-size:21px;fill:#66798a}.head{font-size:23px;font-weight:800}.body{font-size:18px;fill:#435b6d}.small{font-size:16px;fill:#687b8b}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#f5f9fc"/>
  <text class="title" x="600" y="58" text-anchor="middle">Temporal Utility Probe：预注册实验设计</text>
  <text class="sub" x="600" y="92" text-anchor="middle">先测量时间信息的效用分布，再决定双门控、单门控或终止路线</text>

  <rect x="45" y="135" width="260" height="390" rx="22" fill="#fff" stroke="#bad0df" stroke-width="3"/>
  <text class="head" x="175" y="177" text-anchor="middle">实验矩阵</text>
  <text x="175" y="220" text-anchor="middle" font-size="22" font-weight="800" fill="#246b9b">8 个 log-SNR 区间</text>
  <g transform="translate(78 245)">
    <rect width="194" height="26" rx="8" fill="#e3e5e8"/><rect y="32" width="194" height="26" rx="8" fill="#e4e3e9"/><rect y="64" width="194" height="26" rx="8" fill="#e6e1eb"/><rect y="96" width="194" height="26" rx="8" fill="#e8deee"/><rect y="128" width="194" height="26" rx="8" fill="#e2e8ef"/><rect y="160" width="194" height="26" rx="8" fill="#dce9f2"/><rect y="192" width="194" height="26" rx="8" fill="#d4e7f4"/><rect y="224" width="194" height="26" rx="8" fill="#cce4f4"/>
    <text x="97" y="19" text-anchor="middle" font-size="15">高噪声</text><text x="97" y="115" text-anchor="middle" font-size="15">中间阶段</text><text x="97" y="243" text-anchor="middle" font-size="15">低噪声</text>
  </g>
  <text class="body" x="175" y="503" text-anchor="middle">每个区间独立训练轻量 adapter</text>

  <path d="M320 330H365" stroke="#718da3" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="380" y="135" width="330" height="390" rx="22" fill="#fff" stroke="#c9bdd9" stroke-width="3"/>
  <text class="head" x="545" y="177" text-anchor="middle">因果对照</text>
  <rect x="420" y="218" width="250" height="80" rx="16" fill="#e7f4eb"/>
  <text x="545" y="248" text-anchor="middle" font-size="20" font-weight="800" fill="#28714f">Chronological</text>
  <text class="body" x="545" y="279" text-anchor="middle">保持真实小时顺序</text>
  <text x="545" y="333" text-anchor="middle" font-size="24" font-weight="800" fill="#718da3">对比</text>
  <rect x="420" y="365" width="250" height="80" rx="16" fill="#fdecef"/>
  <text x="545" y="395" text-anchor="middle" font-size="20" font-weight="800" fill="#a13c43">Fixed Shuffle</text>
  <text class="body" x="545" y="426" text-anchor="middle">固定打乱小时与 NWP 顺序</text>
  <circle cx="455" cy="483" r="15" fill="#2e74b5"/><circle cx="500" cy="483" r="15" fill="#4f86ad"/><circle cx="545" cy="483" r="15" fill="#7d68a7"/>
  <text class="small" x="585" y="489">3 个训练种子</text>

  <path d="M725 330H770" stroke="#718da3" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="785" y="135" width="370" height="390" rx="22" fill="#fff" stroke="#c5d3dc" stroke-width="3"/>
  <text class="head" x="970" y="177" text-anchor="middle">预注册决策</text>
  <rect x="820" y="215" width="300" height="74" rx="15" fill="#e7f4eb"/>
  <circle cx="855" cy="252" r="20" fill="#28714f"/><text class="white" x="855" y="260" text-anchor="middle" font-size="21" font-weight="800">A</text>
  <text x="890" y="244" font-size="18" font-weight="800" fill="#28714f">SNR 结构与天气交互均成立</text><text class="small" x="890" y="269">进入双门控模型</text>
  <rect x="820" y="315" width="300" height="74" rx="15" fill="#e8f1f7"/>
  <circle cx="855" cy="352" r="20" fill="#2e74b5"/><text class="white" x="855" y="360" text-anchor="middle" font-size="21" font-weight="800">B</text>
  <text x="890" y="344" font-size="18" font-weight="800" fill="#246b9b">仅一种效应稳定成立</text><text class="small" x="890" y="369">保留对应单门控</text>
  <rect x="820" y="415" width="300" height="74" rx="15" fill="#fdecef"/>
  <circle cx="855" cy="452" r="20" fill="#b23a48"/><text class="white" x="855" y="460" text-anchor="middle" font-size="21" font-weight="800">C</text>
  <text x="890" y="444" font-size="18" font-weight="800" fill="#a13c43">效应平坦或 Shuffle 等效</text><text class="small" x="890" y="469">终止门控路线</text>

  <rect x="75" y="565" width="1050" height="72" rx="19" fill="#17365d"/>
  <text class="white" x="600" y="594" text-anchor="middle" font-size="21" font-weight="800">总规模：8 × 2 × 3 = 48 个 retained 轻量 adapter run</text>
  <text x="600" y="622" text-anchor="middle" font-size="17" style="fill:#d8e6ef">共同验证日期、噪声库、Atom allocation 与评价脚本；只改变 SNR 区间、时间顺序和训练种子</text>
</svg>
