<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#718da3"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}.title{font-size:38px;font-weight:800}.sub{font-size:21px;fill:#66798a}.head{font-size:22px;font-weight:800}.body{font-size:17px;fill:#435b6d}.status{font-size:17px;font-weight:800}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#f5f9fc"/>
  <text class="title" x="600" y="58" text-anchor="middle">研究推进逻辑与证据链</text>
  <text class="sub" x="600" y="92" text-anchor="middle">每一阶段先回答一个可检验问题，再决定是否进入下一阶段</text>
  <path d="M120 180H1080" stroke="#b0c2cf" stroke-width="7" stroke-linecap="round"/>

  <g transform="translate(30 125)"><circle cx="70" cy="55" r="34" fill="#2e74b5"/><text class="white" x="70" y="64" text-anchor="middle" font-size="26" font-weight="800">1</text><rect y="110" width="170" height="265" rx="18" fill="#fff" stroke="#bad0df" stroke-width="3"/><text class="head" x="85" y="150" text-anchor="middle">论文复现</text><text class="body" x="85" y="193" text-anchor="middle"><tspan x="85">方法链是否能够</tspan><tspan x="85" dy="26">重建并复现结果？</tspan></text><rect x="18" y="285" width="134" height="48" rx="13" fill="#fff0e5"/><text class="status" x="85" y="315" text-anchor="middle" fill="#a7551c">数值未复现</text></g>
  <path d="M204 180H225" stroke="#718da3" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(225 125)"><circle cx="70" cy="55" r="34" fill="#4f86ad"/><text class="white" x="70" y="64" text-anchor="middle" font-size="26" font-weight="800">2</text><rect y="110" width="170" height="265" rx="18" fill="#fff" stroke="#bad0df" stroke-width="3"/><text class="head" x="85" y="150" text-anchor="middle">跨模型诊断</text><text class="body" x="85" y="193" text-anchor="middle"><tspan x="85">差距来自边际，</tspan><tspan x="85" dy="26">还是轨迹动态？</tspan></text><rect x="18" y="285" width="134" height="48" rx="13" fill="#e7f1f8"/><text class="status" x="85" y="315" text-anchor="middle" fill="#246b9b">定位时间短板</text></g>
  <path d="M399 180H420" stroke="#718da3" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(420 125)"><circle cx="70" cy="55" r="34" fill="#5b927e"/><text class="white" x="70" y="64" text-anchor="middle" font-size="26" font-weight="800">3</text><rect y="110" width="170" height="265" rx="18" fill="#fff" stroke="#bad0df" stroke-width="3"/><text class="head" x="85" y="150" text-anchor="middle">公平协议</text><text class="body" x="85" y="193" text-anchor="middle"><tspan x="85">能否排除数据泄漏</tspan><tspan x="85" dy="26">与随机性混杂？</tspan></text><rect x="18" y="285" width="134" height="48" rx="13" fill="#e7f4eb"/><text class="status" x="85" y="315" text-anchor="middle" fill="#28714f">稳定性通过</text></g>
  <path d="M594 180H615" stroke="#718da3" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(615 125)"><circle cx="70" cy="55" r="34" fill="#c27c0e"/><text class="white" x="70" y="64" text-anchor="middle" font-size="26" font-weight="800">4</text><rect y="110" width="170" height="265" rx="18" fill="#fff" stroke="#e0c58c" stroke-width="3"/><text class="head" x="85" y="150" text-anchor="middle">时间机制</text><text class="body" x="85" y="193" text-anchor="middle"><tspan x="85">时间顺序是否有效，</tspan><tspan x="85" dy="26">且候选是否稳定？</tspan></text><rect x="18" y="285" width="134" height="48" rx="13" fill="#fff4dc"/><text class="status" x="85" y="315" text-anchor="middle" fill="#9b6100">信号成立 / No-Go</text></g>
  <path d="M789 180H810" stroke="#718da3" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(810 125)"><circle cx="70" cy="55" r="34" fill="#7d68a7"/><text class="white" x="70" y="64" text-anchor="middle" font-size="26" font-weight="800">5</text><rect y="110" width="170" height="265" rx="18" fill="#fff" stroke="#c8bbda" stroke-width="3"/><text class="head" x="85" y="150" text-anchor="middle">模型家族比较</text><text class="body" x="85" y="193" text-anchor="middle"><tspan x="85">Flow 或 DDPM</tspan><tspan x="85" dy="26">是否全面占优？</tspan></text><rect x="18" y="285" width="134" height="48" rx="13" fill="#f0ebf6"/><text class="status" x="85" y="315" text-anchor="middle" fill="#66508b">无正式胜者</text></g>
  <path d="M984 180H1005" stroke="#718da3" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(1005 125)"><circle cx="70" cy="55" r="34" fill="#17365d"/><text class="white" x="70" y="64" text-anchor="middle" font-size="26" font-weight="800">6</text><rect y="110" width="170" height="265" rx="18" fill="#fff" stroke="#9fb5c5" stroke-width="3"/><text class="head" x="85" y="150" text-anchor="middle">效用探针</text><text class="body" x="85" y="193" text-anchor="middle"><tspan x="85">时间信息在何种</tspan><tspan x="85" dy="26">条件下最有价值？</tspan></text><rect x="18" y="285" width="134" height="48" rx="13" fill="#e8eef3"/><text class="status" x="85" y="315" text-anchor="middle" fill="#17365d">下一阶段</text></g>

  <rect x="85" y="545" width="1030" height="82" rx="20" fill="#17365d"/>
  <text class="white" x="600" y="579" text-anchor="middle" font-size="22" font-weight="800">逻辑转变</text>
  <text x="600" y="611" text-anchor="middle" font-size="20" style="fill:#d8e6ef">从“直接增加时间模块”转向“先测量天气状态与去噪阶段中的时间效用，再据此设计结构”</text>
</svg>
