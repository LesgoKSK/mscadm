seed: 7
data:
  data_dir: Data
  validation_days: 14
  zones: [1]
  target_scale: minus_one_one
model:
  condition_dim: 20
  sequence_length: 24
  patch_size: 1
  model_dim: 32
  condition_bottleneck: 16
  depth: 1
  heads: 2
  ff_multiplier: 2
  dropout: 0.0
diffusion:
  timesteps: 8
  beta_schedule: cosine
  learn_variance: true
  vlb_weight: 0.001
training:
  batch_size: 8
  steps: 3
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 0
  log_every: 1
  validate_every: 2
  checkpoint_every: 3
  output_dir: outputs/smoke
evaluation:
  scenarios: 3
  batch_size: 2
